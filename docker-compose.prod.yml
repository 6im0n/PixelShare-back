services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pixelshare}
      POSTGRES_USER: ${POSTGRES_USER:-pixelshare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pixelshare} -d ${POSTGRES_DB:-pixelshare}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-pixelshare}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pixelshare}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      STORAGE_PATH: /storage
      PUBLIC_URL: ${PUBLIC_URL}
      FRONTEND_OAUTH_REDIRECT: ${FRONTEND_OAUTH_REDIRECT}
      CORS_ORIGIN: ${CORS_ORIGIN}
      BIND_HOST: 0.0.0.0
      PORT: 3001
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
    ports:
      - "3001:3001"
    volumes:
      - storage:/storage
    networks:
      - internal

volumes:
  db_data:
  storage:

networks:
  internal:
    driver: bridge
